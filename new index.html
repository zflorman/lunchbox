<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF2EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prep">
<title>Prep — lunch bowls for the week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400;12..96,75..100,600;12..96,75..100,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#EEF2EE;
  --surface:#FFFFFF;
  --surface-sunk:#E4EAE4;
  --ink:#16211D;
  --ink-2:#4A5B54;
  --ink-3:#8A9A93;
  --line:#D6DED8;
  --line-strong:#BCC8C0;
  --lime:#A8D82C;
  --lime-deep:#5E7A14;
  --c-mexican:#D6402C;
  --c-mediterranean:#1E7A6B;
  --c-greek:#2563A8;
  --c-asian:#B0246B;
  --c-northafrican:#C2610C;
  --c-middleeastern:#7A4FA8;
  --c-korean:#A32D5E;
  --c-thai:#1D7F4E;
  --c-peruvian:#B5451B;
  --c-indian:#8A6210;
  --c-japanese:#3F5CA8;
  --c-californian:#4E7A2A;
  --r-card:18px;
  --r-pill:999px;
  --shadow:0 1px 2px rgba(22,33,29,.06), 0 6px 18px rgba(22,33,29,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#111815;
    --surface:#1A2320;
    --surface-sunk:#232E2A;
    --ink:#E8EFEA;
    --ink-2:#A6B6AE;
    --ink-3:#75857D;
    --line:#2C3833;
    --line-strong:#3D4B45;
    --lime:#B6E43C;
    --lime-deep:#C9EE6B;
    --c-mexican:#F0644E;
    --c-mediterranean:#3AA593;
    --c-greek:#4F90D8;
    --c-asian:#DC4B8E;
    --c-northafrican:#E08A2E;
    --c-middleeastern:#A17ED0;
    --c-korean:#D25585;
    --c-thai:#3FAA74;
    --c-peruvian:#DC6A3C;
    --c-indian:#BE9032;
    --c-japanese:#6D89D2;
    --c-californian:#7BA84F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + var(--safe-b));
}
h1,h2,h3,.display{font-family:'Bricolage Grotesque','Inter',sans-serif;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
h1{font-size:30px}
h2{font-size:21px}
h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.10em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header.top{padding:22px 0 14px}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

.seg{display:flex;gap:4px;background:var(--surface-sunk);padding:4px;border-radius:var(--r-pill)}
.seg button{flex:1;padding:9px 10px;border-radius:var(--r-pill);font-size:14px;font-weight:500;color:var(--ink-2);transition:.15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 15px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--surface);
  font-size:14px;font-weight:500;color:var(--ink-2);transition:.15s;display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--dot,var(--ink-3));flex:none}
.chip[aria-pressed="true"]{border-color:var(--dot,var(--ink));color:var(--ink);font-weight:600;background:var(--surface)}
.chip.plain[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip:active{transform:scale(.97)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:52px;border-radius:var(--r-pill);font-size:16px;font-weight:600;transition:.15s}
.btn-primary{background:var(--ink);color:var(--ground)}
.btn-primary:active{transform:scale(.985)}
.btn-lime{background:var(--lime);color:#1B2606}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink);min-height:46px;font-size:15px}
.btn-sm{min-height:40px;font-size:14px;padding:0 16px;width:auto}

.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.card-band{padding:13px 16px;display:flex;align-items:center;gap:11px}
.card-band .glyph{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.24);
  display:grid;place-items:center;flex:none;font-size:17px;font-weight:800;color:#fff;font-family:'Bricolage Grotesque',sans-serif}
.card-band .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.card-band .t{font-size:16px;font-weight:600;color:#fff;line-height:1.25;font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.01em}
.card-body{padding:14px 16px 15px}
.taglist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{font-size:12px;padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-sunk);color:var(--ink-2)}
.tag.dayof{background:transparent;border:1px dashed var(--line-strong);color:var(--ink-3)}

.macros{display:flex;align-items:center;gap:14px;padding-top:13px;border-top:1px solid var(--line)}
.ring{position:relative;width:54px;height:54px;flex:none}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:-.02em}
.mstats{display:flex;gap:18px;flex:1}
.mstat .l{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.mstat .v{font-size:14px;font-weight:600}
.cardacts{display:flex;gap:8px;margin-top:13px}
.iconbtn{width:44px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  display:grid;place-items:center;flex:none;color:var(--ink-2)}
.iconbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.iconbtn svg{width:19px;height:19px}

.sheet-scrim{position:fixed;inset:0;background:rgba(22,33,29,.5);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.sheet-scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--ground);
  border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);padding-bottom:calc(28px + var(--safe-b))}
.sheet.open{transform:translateY(0)}
.grabber{width:38px;height:4px;border-radius:2px;background:var(--line-strong);margin:9px auto 0}
.sheet-head{padding:14px 16px 12px;display:flex;gap:12px;align-items:flex-start}
.closebtn{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--surface-sunk);display:grid;place-items:center;flex:none}

.jar{background:var(--surface);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow)}
.layer{display:flex;align-items:center;gap:12px;padding:9px 0}
.layer + .layer{border-top:1px dashed var(--line)}
.layer .bar{width:6px;border-radius:3px;flex:none;align-self:stretch;min-height:26px;background:var(--lb,var(--line-strong))}
.layer .num{font-size:11px;font-weight:700;color:var(--ink-3);width:15px;flex:none;font-variant-numeric:tabular-nums}
.layer .lname{font-size:14px;font-weight:500}
.layer .lrole{font-size:11px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.layer .swap{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);
  border-radius:var(--r-pill);padding:5px 11px;flex:none}

.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.check{width:23px;height:23px;border-radius:7px;border:1.5px solid var(--line-strong);flex:none;display:grid;place-items:center;background:var(--surface)}
.check[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.check svg{width:13px;height:13px;color:var(--lime);opacity:0}
.check[aria-pressed="true"] svg{opacity:1}
.row.done .rname{text-decoration:line-through;color:var(--ink-3)}
.rname{font-size:15px;font-weight:500}
.rqty{margin-left:auto;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none}

.panel{background:var(--surface);border-radius:var(--r-card);padding:4px 16px;box-shadow:var(--shadow)}
.stepwrap{counter-reset:s}
.step{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step .sn{width:25px;height:25px;border-radius:50%;background:var(--ink);color:var(--lime);flex:none;
  display:grid;place-items:center;font-size:12px;font-weight:700}
.step.dayof .sn{background:var(--surface-sunk);color:var(--ink-2)}
.step .st{font-size:14px;line-height:1.55}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);padding:7px 0 calc(7px + var(--safe-b));backdrop-filter:blur(8px)}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--ink-3);font-size:10.5px;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab .badge{position:absolute;transform:translate(14px,-4px);background:var(--lime);color:#1B2606;
  font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 4px}

.empty{text-align:center;padding:52px 24px}
.empty .em{width:56px;height:56px;border-radius:18px;background:var(--surface-sunk);display:grid;place-items:center;margin:0 auto 16px;color:var(--ink-3)}
.empty h3{margin-bottom:6px}
.empty p{font-size:14px;color:var(--ink-2);max-width:280px;margin:0 auto}

.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:24px 0 10px}
.linkbtn{font-size:13px;font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}

.field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:none}
.field .fl{font-size:15px;font-weight:500}
.field .fh{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface-sunk);border-radius:var(--r-pill);padding:3px;flex:none}
.stepper button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:600;color:var(--ink-2)}
.stepper .sv{min-width:34px;text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translate(-50%,14px);z-index:70;
  background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:var(--r-pill);font-size:14px;font-weight:500;
  opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.weekbar{background:var(--ink);color:var(--ground);border-radius:var(--r-card);padding:14px 16px;display:flex;align-items:center;gap:13px;margin-bottom:16px}
.weekbar .wt{font-size:15px;font-weight:600;font-family:'Bricolage Grotesque',sans-serif}
.weekbar .wk{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
.weekbar .go{margin-left:auto;background:rgba(255,255,255,.14);border-radius:var(--r-pill);padding:8px 14px;font-size:13px;font-weight:600;flex:none}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow)}
.mini .ml{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.mini .mv{font-size:22px;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;margin-top:2px}

.lovenote{text-align:center;font-size:12px;color:var(--ink-3);padding:26px 24px 14px;letter-spacing:.01em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2.5px solid var(--lime-deep);outline-offset:2px;border-radius:6px}
</style>
</head>
<body>
<main id="app" class="wrap"></main>
<nav class="tabs" id="tabs"></nav>
<div class="sheet-scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const CUISINES=[
 {id:"mex",name:"Mexican",color:"var(--c-mexican)",glyph:"M",adv:false},
 {id:"med",name:"Mediterranean",color:"var(--c-mediterranean)",glyph:"D",adv:false},
 {id:"grk",name:"Greek",color:"var(--c-greek)",glyph:"G",adv:false},
 {id:"asn",name:"Asian-inspired",color:"var(--c-asian)",glyph:"A",adv:false},
 {id:"naf",name:"North African",color:"var(--c-northafrican)",glyph:"N",adv:true},
 {id:"mde",name:"Middle Eastern",color:"var(--c-middleeastern)",glyph:"E",adv:true},
 {id:"kor",name:"Korean",color:"var(--c-korean)",glyph:"K",adv:true},
 {id:"tha",name:"Thai",color:"var(--c-thai)",glyph:"T",adv:true},
 {id:"per",name:"Peruvian",color:"var(--c-peruvian)",glyph:"P",adv:true},
 {id:"ind",name:"Indian-inspired",color:"var(--c-indian)",glyph:"I",adv:true},
 {id:"jpn",name:"Japanese",color:"var(--c-japanese)",glyph:"J",adv:true},
 {id:"cal",name:"Californian",color:"var(--c-californian)",glyph:"C",adv:true}
];
const ALLC=CUISINES.map(c=>c.id);

function I(id,name,short,cal,p,c,f,qty,unit,cu,extra){
  return Object.assign({id,name,short,cal,p,c,f,qty,unit,cuisines:cu==="all"?ALLC:cu},extra||{});
}

const PROTEINS=[
 I("rotisserie","Rotisserie chicken, shredded","chicken",180,35,0,7,4,"oz","all",{tj:1,hero:1}),
 I("grilledstrips","Grilled chicken strips","chicken",160,33,1,3,4,"oz","all",{tj:1,hero:1}),
 I("chicksausage","Chicken sausage, sliced","chicken sausage",165,18,3,9,1.5,"link","all",{tj:1,hero:1,booster:1}),
 I("chickmeatball","Chicken meatballs","chicken meatball",190,18,8,9,5,"ea","all",{tj:1,hero:1,booster:1}),
 I("turkeymeatball","Turkey meatballs","turkey meatball",200,19,9,10,5,"ea",["med","grk","mex","naf","mde","cal"],{tj:1,hero:1,booster:1}),
 I("pulledchicken","Shredded chipotle chicken","chipotle chicken",190,30,6,5,4,"oz",["mex","per","cal"],{tj:1,hero:1}),
 I("lemonchicken","Lemon-herb chicken breast, sliced","lemon chicken",165,32,1,4,4,"oz",["med","grk","cal","mde"],{tj:1,hero:1}),
 I("shawarmachicken","Shawarma-spiced chicken","shawarma chicken",185,32,2,6,4,"oz",["mde","naf","med"],{tj:1,hero:1}),
 I("teriyakichicken","Teriyaki chicken, sliced","teriyaki chicken",195,31,8,4,4,"oz",["asn","jpn","kor"],{tj:1,hero:1}),
 I("turkeyslices","Roast turkey, torn","turkey",150,30,1,3,4,"oz",["med","cal","grk"],{tj:1,hero:1}),
 I("bakedtofu","Marinated baked tofu, cubed","tofu",150,16,6,8,0.5,"pkg",["asn","jpn","kor","tha","cal","ind"],{tj:1,hero:1,booster:1,veg:1}),
 I("chickpeas","Chickpeas","chickpea",200,11,33,3,0.75,"cup","all",{tj:1,hero:1,booster:1,veg:1}),
 I("blackbeans","Black beans","black bean",165,11,30,1,0.75,"cup",["mex","per","cal"],{tj:1,hero:1,booster:1,veg:1}),
 I("cannellini","Cannellini beans","white bean",160,11,28,1,0.75,"cup",["med","grk","cal","mde"],{tj:1,hero:1,booster:1,veg:1}),
 I("pintobeans","Pinto beans","pinto bean",165,11,29,1,0.75,"cup",["mex","per"],{tj:1,hero:1,booster:1,veg:1}),
 I("lentils","Steamed lentils","lentil",170,13,28,1,0.75,"cup",["med","mde","naf","ind","cal","grk"],{tj:1,hero:1,booster:1,veg:1}),
 I("edamame","Shelled edamame","edamame",140,13,11,6,0.75,"cup",["asn","jpn","kor","tha","cal"],{tj:1,booster:1,veg:1}),
 I("crispychickpeas","Crunchy roasted chickpeas","crispy chickpea",120,6,18,3,0.25,"cup","all",{tj:1,booster:1,veg:1}),
 I("hardegg","Hard-boiled eggs, halved","egg",145,13,1,10,2,"ea",["med","grk","cal","asn"],{tj:1,booster:1}),
 I("cottage","Whipped cottage cheese","cottage cheese",110,14,5,4,0.5,"cup",["med","grk","cal"],{tj:1,booster:1})
];

const BASES=[
 I("greens","Mixed greens","greens",20,2,4,0,3,"cup","all",{style:"salad",tj:1}),
 I("babykale","Baby kale","kale",30,3,5,0,3,"cup","all",{style:"salad",tj:1}),
 I("romaine","Chopped romaine","romaine",20,1,4,0,3,"cup","all",{style:"salad",tj:1}),
 I("cabbage","Shredded cabbage slaw","slaw",30,2,7,0,2,"cup",["asn","mex","kor","tha","cal"],{style:"salad",tj:1}),
 I("arugula","Arugula","arugula",20,2,3,0,3,"cup",["med","grk","cal"],{style:"salad",tj:1}),
 I("cauli","Riced cauliflower","cauliflower rice",45,3,9,0,1,"cup","all",{style:"grain",tj:1}),
 I("farro","Cooked farro","farro",110,4,23,1,0.5,"cup",["med","grk","cal","mde"],{style:"grain",tj:1}),
 I("quinoa","Cooked quinoa","quinoa",110,4,20,2,0.5,"cup","all",{style:"grain",tj:1}),
 I("brownrice","Brown rice","rice",110,3,23,1,0.5,"cup",["asn","jpn","kor","tha","mex","ind","per"],{style:"grain",tj:1}),
 I("couscous","Israeli couscous","couscous",130,5,26,1,0.5,"cup",["med","mde","naf","grk"],{style:"grain",tj:1}),
 I("orzo","Orzo","orzo",140,5,28,1,0.5,"cup",["med","grk","cal"],{style:"pasta",tj:1}),
 I("wwpasta","Whole wheat rotini","rotini",140,6,29,1,0.5,"cup",["med","grk","cal"],{style:"pasta",tj:1}),
 I("soba","Soba noodles","soba",130,6,28,1,0.5,"cup",["asn","jpn"],{style:"pasta",tj:1}),
 I("barley","Pearl barley","barley",110,3,24,0,0.5,"cup",["med","mde","cal"],{style:"grain",tj:1}),
 I("none","No base — dense bean style","",0,0,0,0,0,"","all",{style:"dense"})
];

const MIXINS=[
 I("corn","Roasted corn","corn",65,2,13,1,0.4,"cup",["mex","per","cal"],{tj:1}),
 I("cherrytom","Cherry tomatoes, halved","tomato",20,1,4,0,0.5,"cup","all",{tj:1}),
 I("pickledonion","Pickled red onion","pickled onion",15,0,4,0,2,"tbsp","all",{tj:1}),
 I("cotija","Crumbled cotija","cotija",60,4,1,5,0.2,"cup",["mex","per"],{tj:1}),
 I("jicama","Jicama matchsticks","jicama",25,0,6,0,0.4,"cup",["mex","per"],{tj:1}),
 I("poblano","Roasted poblano strips","poblano",25,1,5,0,0.3,"cup",["mex","per"],{tj:1}),
 I("jalapeno","Pickled jalapeño","jalapeño",5,0,1,0,1,"tbsp",["mex","per","kor"],{tj:1}),

function load(){
  try{const r=JSON.parse(localStorage.getItem(LS));if(r)return Object.assign({},DEF,r,{s:Object.assign({},DEF.s,r.s||{})});}catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function season(){const m=new Date().getMonth();return(m>=10||m<=2)?"cook":"assemble";}
if(!S.mode)S.mode=season();

const POOLS={base:BASES,hero:PROTEINS,booster:PROTEINS,mixin:MIXINS,dressing:DRESSINGS,topper:TOPPERS};
const BYID={};[PROTEINS,BASES,MIXINS,DRESSINGS,TOPPERS].forEach(a=>a.forEach(i=>BYID[i.id]=i));
const cui=id=>CUISINES.find(c=>c.id===id)||CUISINES[0];

function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function ok(i,c){return i.cuisines.includes(c)&&!S.banned.includes(i.id);}
function pool(arr,c,f){return arr.filter(i=>ok(i,c)&&(!f||f(i)));}

function macros(b){
  const all=[b.base,...b.proteins,...b.mixins,b.dressing,b.topper].filter(x=>x&&!x.skip);
  return all.reduce((t,i)=>({cal:t.cal+i.cal,p:t.p+i.p,c:t.c+i.c,f:t.f+i.f}),{cal:0,p:0,c:0,f:0});
}
function sig(b){return[b.base.id,...b.proteins.map(p=>p.id).sort(),...b.mixins.map(m=>m.id).sort(),b.dressing.id,b.topper.id].join("|");}

function nameOf(b){
  const hero=b.proteins[0],second=b.proteins[1],m=b.mixins.find(x=>!x.dayof)||b.mixins[0];
  let tail=second&&second.short!==hero.short?second.short:(m?m.short:"");
  let n=b.dressing.short+" "+hero.short+(tail?" and "+tail:"")+" bowl";
  return n.charAt(0).toUpperCase()+n.slice(1);
}

function build(c,must){
  must=must||[];
  const mustI=must.map(id=>BYID[id]).filter(Boolean);
  const styles=["grain","grain","grain","salad","salad","pasta","dense"];
  let style=rnd(styles);
  const mb=mustI.find(i=>BASES.includes(i));
  if(mb)style=mb.style;
  const bp=pool(BASES,c,i=>i.style===style);
  if(!bp.length)return null;
  const base=mb||rnd(bp);
  const mustP=mustI.filter(i=>PROTEINS.includes(i));
  const hp=pool(PROTEINS,c,i=>i.hero&&(style!=="dense"||i.veg));
  if(!hp.length)return null;
  let hero=mustP.find(i=>i.hero)||rnd(hp);
  if(style==="dense"&&!hero.veg)return null;
  const proteins=[hero];
  const mustB=mustP.find(i=>i!==hero);
  if(mustB)proteins.push(mustB);
  else if(Math.random()<.72){
    const bp2=pool(PROTEINS,c,i=>i.booster&&i.id!==hero.id);
    if(bp2.length)proteins.push(rnd(bp2));
  }
  const mustM=mustI.filter(i=>MIXINS.includes(i));
  const mixins=[...mustM];
  const mp=pool(MIXINS,c,i=>!i.dayof&&!mixins.includes(i));
  const want=3+(Math.random()<.45?1:0);
  let guard=0;
  while(mixins.length<want&&guard++<40){const m=rnd(mp);if(m&&!mixins.includes(m))mixins.push(m);}
  if(mixins.length<2)return null;
  if(Math.random()<.5){const dp=pool(MIXINS,c,i=>i.dayof);if(dp.length)mixins.push(rnd(dp));}
  const dp2=pool(DRESSINGS,c);
  if(!dp2.length)return null;
  const dressing=mustI.find(i=>DRESSINGS.includes(i))||rnd(dp2);
  const tp=pool(TOPPERS,c,i=>!i.skip);
  const topper=mustI.find(i=>TOPPERS.includes(i))||(Math.random()<.68&&tp.length?rnd(tp):BYID.none2);
  const b={cuisine:c,style:base.style,base,proteins,mixins,dressing,topper};
  b.m=macros(b);b.sig=sig(b);b.name=nameOf(b);b.id=b.sig;
  return b;
}

function passes(m){const s=S.s;return m.p>=s.pMin&&m.p<=s.pMax&&m.cal>=s.cMin&&m.cal<=s.cMax;}

function generate(n,must){
  let cs=activeCuisines();
  if(!cs.length)return[];
  if(must&&must.length){
    const mi=must.map(id=>BYID[id]).filter(Boolean);
    let fit=cs.filter(c=>mi.every(i=>i.cuisines.includes(c)));
    if(!fit.length)fit=cs.filter(c=>mi.some(i=>i.cuisines.includes(c)));
    if(fit.length)cs=fit;
  }
  const out=[],seen=new Set(results.map(r=>r.sig).concat(S.history));
  let t=0;
  while(out.length<n&&t++<6000){
    const b=build(rnd(cs),must);
    if(!b||!passes(b.m)||seen.has(b.sig))continue;
    seen.add(b.sig);out.push(b);
  }
  if(out.length<n){
    let t2=0;
    while(out.length<n&&t2++<3000){
      const b=build(rnd(cs),must);
      if(!b||seen.has(b.sig))continue;
      if(b.m.p<S.s.pMin-4||b.m.cal>S.s.cMax+80)continue;
      seen.add(b.sig);out.push(b);
    }
  }
  return out;
}
function activeCuisines(){return S.cuisines.filter(id=>S.adv||!cui(id).adv);}

function swap(b,slot,idx){
  const c=b.cuisine;
  for(let i=0;i<80;i++){
    const n=JSON.parse(JSON.stringify(b));
    n.base=BYID[n.base.id];n.proteins=n.proteins.map(p=>BYID[p.id]);
    n.mixins=n.mixins.map(m=>BYID[m.id]);n.dressing=BYID[n.dressing.id];n.topper=BYID[n.topper.id];
    if(slot==="base"){const p=pool(BASES,c,x=>x.style===b.style&&x.id!==b.base.id);if(!p.length)break;n.base=rnd(p);}
    if(slot==="protein"){
      const isHero=idx===0;
      const p=pool(PROTEINS,c,x=>(isHero?x.hero:x.booster)&&!n.proteins.some((q,j)=>j!==idx&&q.id===x.id)&&x.id!==b.proteins[idx].id);
      if(!p.length)break;n.proteins[idx]=rnd(p);
    }
    if(slot==="mixin"){
      const cur=b.mixins[idx];
      const p=pool(MIXINS,c,x=>!!x.dayof===!!cur.dayof&&!n.mixins.some(q=>q.id===x.id));
      if(!p.length)break;n.mixins[idx]=rnd(p);
    }
    if(slot==="dressing"){const p=pool(DRESSINGS,c,x=>x.id!==b.dressing.id);if(!p.length)break;n.dressing=rnd(p);}
    if(slot==="topper"){const p=pool(TOPPERS,c,x=>x.id!==b.topper.id);if(!p.length)break;n.topper=rnd(p);}
    n.m=macros(n);n.sig=sig(n);n.name=nameOf(n);n.id=n.sig;
    if(passes(n.m))return n;
    if(i>60)return n;
  }
  return b;
}

function frac(n){
  if(n===0)return"";
  const w=Math.floor(n),r=+(n-w).toFixed(2);
  const map={0.25:"¼",0.33:"⅓",0.5:"½",0.67:"⅔",0.75:"¾",0.2:"⅕",0.4:"⅖",0.6:"⅗",0.8:"⅘",0.13:"⅛",0.38:"⅜",0.63:"⅝",0.88:"⅞"};
  let best="",bd=1;
  for(const k in map){const d=Math.abs(r-k);if(d<bd&&d<.06){bd=d;best=map[k];}}
  if(!best)return(+n.toFixed(2)).toString();
  return(w?w+" ":"")+best;
}
function qty(i,mult){
  if(!i.qty)return"";
  const n=i.qty*(mult||1);
  const u=i.unit==="ea"?"":i.unit;
  return(frac(n)+(u?" "+u:"")+(n>1&&["cup","link","can","pkg","clove","bunch"].includes(u)?"s":"")).trim();
}

function layers(b){
  const L=[];
  if(b.style==="salad")L.push({i:b.dressing,role:"Dressing",slot:"dressing",note:"goes in first so greens stay dry"});
  else L.push({i:b.dressing,role:"Dressing",slot:"dressing",note:"tossed with the base while it soaks in"});
  if(b.base.id!=="none")L.push({i:b.base,role:"Base",slot:"base"});
  b.proteins.forEach((p,i)=>L.push({i:p,role:i?"Protein boost":"Protein",slot:"protein",idx:i}));
  b.mixins.forEach((m,i)=>{if(!m.dayof)L.push({i:m,role:"Mix-in",slot:"mixin",idx:i});});
  b.mixins.forEach((m,i)=>{if(m.dayof)L.push({i:m,role:"Add day-of",slot:"mixin",idx:i,dayof:1});});
  if(!b.topper.skip)L.push({i:b.topper,role:"Add day-of",slot:"topper",dayof:1});
  return L;
}

function steps(b){
  const n=S.s.servings,out=[];
  const hardy=b.mixins.filter(m=>!m.dayof),soft=b.mixins.filter(m=>m.dayof);
  const list=a=>a.map(x=>x.short||x.name).join(", ");
  if(b.style==="salad"){
    out.push({t:`Spoon ${qty(b.dressing,n)} of ${b.dressing.short.toLowerCase()} into the bottom of ${n} containers.`});
    out.push({t:`Add ${list(hardy)} on top of the dressing — these can sit in it all week without going soft.`});
    out.push({t:`Layer in ${list(b.proteins)}.`});
    out.push({t:`Finish with ${b.base.short} packed loosely on top, so it never touches the dressing. Seal and refrigerate.`});
  }else if(b.style==="dense"){
    out.push({t:`Toss ${list(b.proteins)} with ${qty(b.dressing,n)} of ${b.dressing.short.toLowerCase()} in a large bowl and let it sit 10 minutes — beans soak up dressing the longer they sit.`});
    out.push({t:`Fold in ${list(hardy)}.`});
    out.push({t:`Divide across ${n} containers. This one actually improves by Wednesday.`});
  }else{
    out.push({t:`Cook and cool ${b.base.short} completely. Warm ${b.base.short} turns everything else limp.`});
    out.push({t:`Toss the cooled ${b.base.short} with ${qty(b.dressing,n)} of ${b.dressing.short.toLowerCase()}.`});
    out.push({t:`Fold in ${list(b.proteins)} and ${list(hardy)}.`});
    out.push({t:`Divide across ${n} containers and refrigerate.`});
  }
  const day=[...soft];if(!b.topper.skip)day.push(b.topper);
  if(day.length)out.push({dayof:1,t:`Keep ${list(day)} on the counter or in a separate container. Add ${day.length>1?"them":"it"} the morning you eat that bowl — ${day.some(d=>d.id==="avocado")?"avocado browns and ":""}anything crunchy goes soft after a day in there.`});
  return out;
}

      <div class="step${s.dayof?" dayof":""}"><span class="sn">${s.dayof?"·":i+1}</span><span class="st">${esc(s.t)}</span></div>`).join("")}</div>
    <div class="section-h"><h3>Ban an ingredient</h3></div>
    <div class="chips" style="margin-bottom:20px">${[b.base,...b.proteins,...b.mixins,b.dressing,b.topper]
      .filter(i=>i&&!i.skip&&i.id!=="none").map(i=>`<button class="chip" data-ban="${i.id}">${esc(i.short||i.name)} ✕</button>`).join("")}</div>
    <button class="btn btn-primary" data-act="week" data-id="${b.id}" data-ctx="${ctx}" style="margin-bottom:8px">Make this my week</button>
    <button class="btn btn-ghost" data-act="save" data-id="${b.id}" data-ctx="${ctx}" style="margin-bottom:8px">${isSaved?"Remove from saved":"Save for later"}</button>
  </div>`);
}

function recipeSheet(r){
  const c=cui(r.cuisine);
  openSheet(`
  <div class="sheet-head">
    <div><p class="eyebrow" style="color:${c.color}">${esc(c.name)} · ${esc(r.kind)} · ${esc(r.time)}</p>
    <h2 style="margin-top:4px">${esc(r.name)}</h2></div>
    <button class="closebtn" data-act="close" aria-label="Close">${svg("x",2.2)}</button>
  </div>
  <div class="wrap">
    <div class="grid2" style="margin-bottom:8px">
      <div class="mini"><p class="ml">Protein</p><p class="mv tnum">${r.p}g</p></div>
      <div class="mini"><p class="ml">Calories</p><p class="mv tnum">${r.cal}</p></div>
      <div class="mini"><p class="ml">Carbs</p><p class="mv tnum">${r.c}g</p></div>
      <div class="mini"><p class="ml">Fat</p><p class="mv tnum">${r.f}g</p></div>
    </div>
    <div class="section-h"><h3>What you need</h3><span class="muted" style="font-size:12px">makes 5</span></div>
    <div class="panel">${r.ing.map(x=>`<div class="row"><span class="rname">${esc(x[0])}</span><span class="rqty">${esc(frac(x[1])+(x[2]==="ea"?"":" "+x[2]))}</span></div>`).join("")}</div>
    <div class="section-h"><h3>Method</h3></div>
    <div class="panel stepwrap">${r.steps.map((s,i)=>`<div class="step"><span class="sn">${i+1}</span><span class="st">${esc(s)}</span></div>`).join("")}</div>
    ${r.note?`<p class="muted" style="font-size:13px;margin:12px 2px 0">${esc(r.note)}</p>`:""}
    <button class="btn btn-primary" data-act="weekr" data-id="${r.id}" style="margin:18px 0 8px">Make this my week</button>
  </div>`);
}

function pickerSheet(){
  const cs=activeCuisines();
  const inC=arr=>arr.filter(i=>cs.some(c=>i.cuisines.includes(c))&&!S.banned.includes(i.id)&&i.id!=="none"&&!i.skip);
  const grp=(t,arr)=>`<p class="eyebrow" style="margin:18px 0 9px">${t}</p><div class="chips">${arr.map(i=>
    `<button class="chip plain" data-pick="${i.id}" aria-pressed="${pickSel.includes(i.id)}">${esc(i.short||i.name)}</button>`).join("")}</div>`;
  openSheet(`
  <div class="sheet-head">
    <div><p class="eyebrow">Not feeling those</p><h2 style="margin-top:4px">What do you actually want?</h2></div>
    <button class="closebtn" data-act="close" aria-label="Close">${svg("x",2.2)}</button>
  </div>
  <div class="wrap">
    <p class="muted" style="font-size:14px">Pick anything that sounds good. You'll get bowls built around it that still hit your numbers.</p>
    ${grp("Protein",inC(PROTEINS))}
    ${grp("Base",inC(BASES))}
    ${grp("Mix-ins",inC(MIXINS))}
    ${grp("Dressing",inC(DRESSINGS))}
    <button class="btn btn-primary" data-act="findlike" style="margin:22px 0 8px">Find bowls like this<span class="tnum" style="opacity:.7">${pickSel.length?" · "+pickSel.length:""}</span></button>
  </div>`);
}
function setTab(t){S.tab=t;save();view();}

function toggleSave(b){
  const i=S.saved.findIndex(x=>x.id===b.id);
  if(i>=0){S.saved.splice(i,1);toast("Removed from saved");}
  else{S.saved.unshift(b);toast("Saved");}
  save();
}
function setWeek(b){
  if(S.week&&S.week.id===b.id){S.week=null;S.checked={};toast("Cleared this week");}
  else{S.week=b;S.checked={};toast("Set as this week's prep");}
  save();
}

function replaceIn(arr,id,nb){const i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]=nb;}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-mode],[data-adv],[data-cui],[data-act],[data-check],[data-set],[data-ban],[data-unban],[data-pick],[data-swap]");
  if(!t)return;
  const d=t.dataset;

  if(d.tab){closeSheet();setTab(d.tab);return;}
  if(d.mode){S.mode=d.mode;save();view();return;}
  if(d.adv!==undefined&&d.adv!==""){
    S.adv=d.adv==="1";
    if(!S.adv)S.cuisines=S.cuisines.filter(id=>!cui(id).adv);
    save();view();return;
  }
  if(d.cui){
    const i=S.cuisines.indexOf(d.cui);
    if(i>=0)S.cuisines.splice(i,1);else S.cuisines.push(d.cui);
    save();view();return;
  }
  if(d.check!==undefined){
    S.checked[d.check]=!S.checked[d.check];save();view();return;
  }
  if(d.set){
    const k=d.set,step=+d.d;
    const lim={servings:[1,10],pMin:[15,50],pMax:[20,70],cMin:[200,700],cMax:[300,900]}[k];
    let v=S.s[k]+step;
    v=Math.max(lim[0],Math.min(lim[1],v));
    if(k==="pMin"&&v>S.s.pMax-5)v=S.s.pMax-5;
    if(k==="pMax"&&v<S.s.pMin+5)v=S.s.pMin+5;
    if(k==="cMin"&&v>S.s.cMax-60)v=S.s.cMax-60;
    if(k==="cMax"&&v<S.s.cMin+60)v=S.s.cMin+60;
    S.s[k]=v;save();view();return;
  }
  if(d.ban){
    if(!S.banned.includes(d.ban))S.banned.push(d.ban);
    results=results.filter(b=>![b.base,...b.proteins,...b.mixins,b.dressing,b.topper].some(i=>i&&i.id===d.ban));
    save();closeSheet();view();toast("Banned "+(BYID[d.ban]||{name:""}).name.toLowerCase());return;
  }
  if(d.unban){S.banned=S.banned.filter(x=>x!==d.unban);save();view();return;}
  if(d.pick){
    const i=pickSel.indexOf(d.pick);
    if(i>=0)pickSel.splice(i,1);else pickSel.push(d.pick);
    pickerSheet();sheet.scrollTop=0;return;
  }
  if(d.swap){
    const b=findBowl(d.id,d.ctx);if(!b)return;
    const nb=swap(b,d.swap,+d.idx||0);
    if(nb.id===b.id){toast("Nothing else fits there");return;}
    replaceIn(results,b.id,nb);replaceIn(S.saved,b.id,nb);
    if(S.week&&S.week.id===b.id){S.week=nb;S.checked={};}
    save();bowlSheet(nb,d.ctx);view();return;
  }

  const act=d.act;
  if(act==="close"){closeSheet();return;}
  if(act==="gen"){
    if(!activeCuisines().length){toast("Pick at least one cuisine");return;}
    if(S.mode==="cook"){
      const cs=activeCuisines();
      let pool=COOK_RECIPES.filter(r=>cs.includes(r.cuisine)&&!S.history.includes(r.id));
      if(pool.length<4)pool=COOK_RECIPES.filter(r=>cs.includes(r.cuisine));
      if(!pool.length)pool=COOK_RECIPES;
      cookResults=pool.sort(()=>Math.random()-.5).slice(0,8);
    }else{
      results=[];results=generate(8);
      if(!results.length)toast("Nothing fits those targets — try widening them in Settings");
    }
    view();return;
  }
  if(act==="more"){
    if(S.mode==="cook"){
      const have=cookResults.map(r=>r.id);
      const rest=COOK_RECIPES.filter(r=>activeCuisines().includes(r.cuisine)&&!have.includes(r.id));
      if(!rest.length){toast("That's every recipe for these cuisines");return;}
      cookResults=cookResults.concat(rest.sort(()=>Math.random()-.5).slice(0,6));
    }else{
      const more=generate(12);
      if(!more.length){toast("Out of new combinations — try more cuisines");return;}
      results=results.concat(more);
    }
    view();return;
  }
  if(act==="picker"){pickSel=[];pickerSheet();return;}
  if(act==="findlike"){
    if(!pickSel.length){toast("Pick at least one ingredient");return;}
    results=[];
    let out=[];
    for(const id of pickSel){out=out.concat(generate(3,[id]));}
    out=out.concat(generate(4,pickSel.slice(0,2)));
    const seen=new Set();
    results=out.filter(b=>{if(seen.has(b.sig))return false;seen.add(b.sig);return true;});
    closeSheet();
    if(!results.length)toast("Nothing hit your numbers with those — try fewer picks");
    view();return;
  }
  if(act==="open"){const b=findBowl(d.id,d.ctx);if(b)bowlSheet(b,d.ctx);return;}
  if(act==="openr"){const r=COOK_RECIPES.find(x=>x.id===d.id);if(r)recipeSheet(r);return;}
  if(act==="openweek"){
    if(!S.week)return;
    if(S.week.kind)recipeSheet(S.week);else bowlSheet(S.week,"week");
    return;
  }
  if(act==="save"){const b=findBowl(d.id,d.ctx);if(!b)return;toggleSave(b);if(sheet.classList.contains("open"))bowlSheet(b,d.ctx);view();return;}
  if(act==="week"){const b=findBowl(d.id,d.ctx);if(!b)return;setWeek(b);closeSheet();view();return;}
  if(act==="weekr"){const r=COOK_RECIPES.find(x=>x.id===d.id);if(!r)return;setWeek(r);closeSheet();view();return;}
  if(act==="madeit"){
    if(S.week){S.history.unshift(S.week.id);S.history=S.history.slice(0,60);}
    S.week=null;S.checked={};save();view();toast("Nice. Marked as made.");return;
  }
  if(act==="clearban"){S.banned=[];save();view();return;}
  if(act==="reset"){
    if(confirm("Reset saved bowls, settings, and history?")){
      localStorage.removeItem(LS);S=JSON.parse(JSON.stringify(DEF));S.mode=season();
      results=[];cookResults=[];save();view();toast("Reset");
    }
    return;
  }
});

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet.classList.contains("open"))closeSheet();});

view();
</script>
</body>
</html>
